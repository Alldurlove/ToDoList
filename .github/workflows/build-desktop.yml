name: Build Desktop Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle_args: --bundles msi,nsis
            artifact_name: windows-installers
            tauri_binary_pkg: "@tauri-apps/cli-win32-x64-msvc"
          - os: ubuntu-24.04
            bundle_args: --bundles deb,rpm
            artifact_name: linux-installers
            tauri_binary_pkg: "@tauri-apps/cli-linux-x64-gnu"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install project dependencies
        env:
          NODE_ENV: development
          NPM_CONFIG_OMIT: ""
        run: npm ci --include=dev --no-audit --no-fund

      - name: Ensure Tauri CLI and platform binary
        run: |
          npm install --no-save @tauri-apps/cli@2.11.1 ${{ matrix.tauri_binary_pkg }}
          node -e "console.log(require.resolve('@tauri-apps/cli/package.json'))"
          node -e "console.log(require.resolve('${{ matrix.tauri_binary_pkg }}/package.json'))"

      - name: Build desktop bundles
        run: npx --yes tauri build ${{ matrix.bundle_args }}

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
          if-no-files-found: error

      - name: Attach files to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
